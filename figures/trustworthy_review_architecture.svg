<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="desc">
  <desc id="desc">无图标版智能评审系统架构图，展示五层系统结构和贯穿式可信评审机制。</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #ffffff; stroke: #b8cce8; stroke-width: 2; }
      .side-panel { fill: #fffafa; stroke: #dc7d72; stroke-width: 2.2; }
      .blue-card { fill: #f7fbff; stroke: #98b8df; stroke-width: 2; }
      .yellow-card { fill: #fffaf0; stroke: #d9a845; stroke-width: 2; }
      .red-card { fill: #fff6f4; stroke: #d87368; stroke-width: 2; }
      .dark-blue { fill: #153d6f; }
      .blue-text { fill: #163f70; }
      .muted { fill: #5d7188; }
      .yellow-text { fill: #8b5e00; }
      .red-text { fill: #8d2d25; }
      .title { font: 700 24px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; }
      .layer-title { font: 700 22px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; }
      .layer-sub { font: 600 14px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; }
      .card-title { font: 700 18px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; }
      .card-sub { font: 500 14px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; }
      .note { font: 600 14px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; }
      .legend { font: 600 15px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; }
      .num { fill: #ffffff; font: 700 18px Arial, sans-serif; }
      .line { stroke: #6d8eb8; stroke-width: 2; fill: none; }
      .dash { stroke: #d4a340; stroke-width: 2; stroke-dasharray: 7 6; fill: none; }
      .red-line { stroke: #d87368; stroke-width: 2; fill: none; }
    </style>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#6d8eb8"/>
    </marker>
    <marker id="arrow-yellow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#d4a340"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="900"/>

  <g transform="translate(26 18)">
    <rect class="panel" x="0" y="0" width="1284" height="126" rx="10"/>
    <rect class="dark-blue" x="24" y="31" width="34" height="34" rx="6"/>
    <text class="num" x="41" y="55" text-anchor="middle">1</text>
    <text class="layer-title blue-text" x="78" y="52">交互展示层</text>
    <text class="layer-sub muted" x="78" y="84">多入口审查工作台</text>

    <rect class="blue-card" x="246" y="25" width="258" height="76" rx="8"/>
    <text class="card-title blue-text" x="375" y="55" text-anchor="middle">Vue 前端界面</text>
    <text class="card-sub muted" x="375" y="80" text-anchor="middle">Element Plus / Vite</text>

    <rect class="blue-card" x="514" y="25" width="258" height="76" rx="8"/>
    <text class="card-title blue-text" x="643" y="55" text-anchor="middle">审查过程可视化</text>
    <text class="card-sub muted" x="643" y="80" text-anchor="middle">SSE 流式事件展示</text>

    <rect class="blue-card" x="782" y="25" width="258" height="76" rx="8"/>
    <text class="card-title blue-text" x="911" y="55" text-anchor="middle">证据与观点面板</text>
    <text class="card-sub muted" x="911" y="80" text-anchor="middle">证据卡片 / Agent 观点</text>

    <rect class="blue-card" x="1050" y="25" width="206" height="76" rx="8"/>
    <text class="card-title blue-text" x="1153" y="55" text-anchor="middle">复核与报告入口</text>
    <text class="card-sub muted" x="1153" y="80" text-anchor="middle">人工补正 / 裁决报告</text>
  </g>

  <path class="line" d="M690 144 V152" marker-end="url(#arrow-blue)"/>

  <g transform="translate(26 152)">
    <rect class="panel" x="0" y="0" width="1284" height="120" rx="10"/>
    <rect class="dark-blue" x="24" y="27" width="34" height="34" rx="6"/>
    <text class="num" x="41" y="51" text-anchor="middle">2</text>
    <text class="layer-title blue-text" x="78" y="49">服务接口层</text>
    <text class="layer-sub muted" x="78" y="81">统一 API 与审查会话</text>

    <rect class="blue-card" x="246" y="24" width="258" height="72" rx="8"/>
    <text class="card-title blue-text" x="375" y="53" text-anchor="middle">FastAPI 服务</text>
    <text class="card-sub muted" x="375" y="78" text-anchor="middle">api/main.py</text>

    <rect class="blue-card" x="514" y="24" width="258" height="72" rx="8"/>
    <text class="card-title blue-text" x="643" y="53" text-anchor="middle">审查任务接口</text>
    <text class="card-sub muted" x="643" y="78" text-anchor="middle">intent / debate / stream</text>

    <rect class="blue-card" x="782" y="24" width="258" height="72" rx="8"/>
    <text class="card-title blue-text" x="911" y="53" text-anchor="middle">历史会话接口</text>
    <text class="card-sub muted" x="911" y="78" text-anchor="middle">sessions / detail / review</text>

    <rect class="blue-card" x="1050" y="24" width="206" height="72" rx="8"/>
    <text class="card-title blue-text" x="1153" y="53" text-anchor="middle">官方报告接口</text>
    <text class="card-sub muted" x="1153" y="78" text-anchor="middle">PDF 生成与下载</text>
  </g>

  <path class="line" d="M690 272 V280" marker-end="url(#arrow-blue)"/>

  <g transform="translate(26 280)">
    <rect class="panel" x="0" y="0" width="1284" height="144" rx="10"/>
    <rect class="dark-blue" x="24" y="42" width="34" height="34" rx="6"/>
    <text class="num" x="41" y="66" text-anchor="middle">3</text>
    <text class="layer-title blue-text" x="78" y="53">智能评审</text>
    <text class="layer-title blue-text" x="78" y="83">编排层</text>

    <rect class="blue-card" x="214" y="41" width="210" height="64" rx="8"/>
    <text class="card-title blue-text" x="319" y="68" text-anchor="middle">意图政策理解</text>
    <text class="card-sub muted" x="319" y="91" text-anchor="middle">intent / policy router</text>

    <rect class="yellow-card" x="434" y="41" width="190" height="64" rx="8"/>
    <text class="card-title yellow-text" x="529" y="68" text-anchor="middle">Text-to-SQL</text>
    <text class="card-sub muted" x="529" y="91" text-anchor="middle">生成 / 执行 / 修复</text>

    <rect class="yellow-card" x="654" y="41" width="202" height="64" rx="8"/>
    <text class="card-title yellow-text" x="755" y="68" text-anchor="middle">证据标准化</text>
    <text class="card-sub muted" x="755" y="91" text-anchor="middle">EvidenceItem / Bundle</text>

    <rect class="blue-card" x="886" y="41" width="194" height="64" rx="8"/>
    <text class="card-title blue-text" x="983" y="68" text-anchor="middle">辩论编排</text>
    <text class="card-sub muted" x="983" y="91" text-anchor="middle">多轮审查</text>

    <rect class="red-card" x="1112" y="41" width="144" height="64" rx="8"/>
    <text class="card-title red-text" x="1184" y="68" text-anchor="middle">仲裁报告</text>
    <text class="card-sub muted" x="1184" y="91" text-anchor="middle">Arbiter / Report</text>

    <path class="line" d="M424 73 H434" marker-end="url(#arrow-blue)"/>
    <path class="line" d="M624 73 H654" marker-end="url(#arrow-blue)"/>
    <path class="line" d="M856 73 H886" marker-end="url(#arrow-blue)"/>
    <path class="line" d="M1080 73 H1112" marker-end="url(#arrow-blue)"/>
    <path class="dash" d="M500 34 C558 8 632 8 715 34" marker-end="url(#arrow-yellow)"/>
    <text class="note yellow-text" x="596" y="22" text-anchor="middle">SQL 事实约束</text>
    <text class="note blue-text" x="930" y="127">先取证，后推理；SQL 事实优先</text>
  </g>

  <path class="line" d="M690 424 V432" marker-end="url(#arrow-blue)"/>

  <g transform="translate(26 432)">
    <rect class="panel" x="0" y="0" width="1284" height="108" rx="10"/>
    <rect class="dark-blue" x="24" y="26" width="34" height="34" rx="6"/>
    <text class="num" x="41" y="50" text-anchor="middle">4</text>
    <text class="layer-title blue-text" x="78" y="50">多智能体协同层</text>

    <rect class="blue-card" x="224" y="30" width="180" height="48" rx="7"/>
    <text class="card-title blue-text" x="314" y="61" text-anchor="middle">严格合规 Agent</text>

    <rect class="blue-card" x="414" y="30" width="180" height="48" rx="7"/>
    <text class="card-title blue-text" x="504" y="61" text-anchor="middle">宽松业务 Agent</text>

    <rect class="blue-card" x="604" y="30" width="180" height="48" rx="7"/>
    <text class="card-title blue-text" x="694" y="61" text-anchor="middle">探索补充 Agent</text>

    <rect class="blue-card" x="794" y="30" width="180" height="48" rx="7"/>
    <text class="card-title blue-text" x="884" y="61" text-anchor="middle">经验案例 Agent</text>

    <rect class="blue-card" x="984" y="30" width="180" height="48" rx="7"/>
    <text class="card-title blue-text" x="1074" y="61" text-anchor="middle">审计质询 Agent</text>

    <rect class="red-card" x="1176" y="30" width="80" height="48" rx="7"/>
    <text class="card-title red-text" x="1216" y="61" text-anchor="middle">仲裁</text>
  </g>

  <path class="line" d="M690 540 V548" marker-end="url(#arrow-blue)"/>

  <g transform="translate(26 548)">
    <rect class="panel" x="0" y="0" width="1284" height="168" rx="10"/>
    <rect class="dark-blue" x="24" y="58" width="34" height="34" rx="6"/>
    <text class="num" x="41" y="82" text-anchor="middle">5</text>
    <text class="layer-title blue-text" x="78" y="64">知识与数据</text>
    <text class="layer-title blue-text" x="78" y="94">支撑层</text>

    <rect class="blue-card" x="246" y="25" width="532" height="118" rx="9"/>
    <text class="card-title blue-text" x="270" y="55">A. 知识支撑</text>
    <rect class="blue-card" x="276" y="76" width="150" height="45" rx="7"/>
    <text class="card-title blue-text" x="351" y="101" text-anchor="middle">政策知识库</text>
    <text class="card-sub muted" x="351" y="119" text-anchor="middle">JSON / 政策文本</text>
    <rect class="blue-card" x="438" y="76" width="150" height="45" rx="7"/>
    <text class="card-title blue-text" x="513" y="101" text-anchor="middle">数据库 Schema</text>
    <text class="card-sub muted" x="513" y="119" text-anchor="middle">schema_struct.sql</text>
    <rect class="blue-card" x="600" y="76" width="150" height="45" rx="7"/>
    <text class="card-title blue-text" x="675" y="101" text-anchor="middle">业务字典</text>
    <text class="card-sub muted" x="675" y="119" text-anchor="middle">dicts / 权责映射</text>

    <rect class="yellow-card" x="800" y="25" width="456" height="118" rx="9"/>
    <text class="card-title yellow-text" x="824" y="55">B. 数据支撑</text>
    <rect class="yellow-card" x="830" y="76" width="180" height="45" rx="7"/>
    <text class="card-title yellow-text" x="920" y="101" text-anchor="middle">业务数据库</text>
    <text class="card-sub muted" x="920" y="119" text-anchor="middle">社保 / 就业 / 企业</text>
    <rect class="yellow-card" x="1030" y="76" width="196" height="45" rx="7"/>
    <text class="card-title yellow-text" x="1128" y="101" text-anchor="middle">审查记录存储</text>
    <text class="card-sub muted" x="1128" y="119" text-anchor="middle">会话 / 证据 / 报告</text>
  </g>

  <g transform="translate(1336 18)">
    <rect class="side-panel" x="0" y="0" width="238" height="770" rx="12"/>
    <text class="title red-text" x="119" y="48" text-anchor="middle">贯穿式可信</text>
    <text class="title red-text" x="119" y="82" text-anchor="middle">评审机制</text>
    <path class="red-line" d="M119 104 V664"/>

    <rect class="red-card" x="31" y="122" width="176" height="74" rx="8"/>
    <text class="card-title red-text" x="119" y="155" text-anchor="middle">证据约束推理</text>
    <text class="card-sub muted" x="119" y="180" text-anchor="middle">结论绑定证据</text>

    <rect class="red-card" x="31" y="232" width="176" height="74" rx="8"/>
    <text class="card-title red-text" x="119" y="265" text-anchor="middle">SQL 执行反馈</text>
    <text class="card-sub muted" x="119" y="290" text-anchor="middle">自动修复查询</text>

    <rect class="red-card" x="31" y="342" width="176" height="74" rx="8"/>
    <text class="card-title red-text" x="119" y="375" text-anchor="middle">多角色冲突检测</text>
    <text class="card-sub muted" x="119" y="400" text-anchor="middle">观点交叉校验</text>

    <rect class="red-card" x="31" y="452" width="176" height="74" rx="8"/>
    <text class="card-title red-text" x="119" y="485" text-anchor="middle">保守仲裁裁决</text>
    <text class="card-sub muted" x="119" y="510" text-anchor="middle">风险优先处理</text>

    <rect class="red-card" x="31" y="562" width="176" height="74" rx="8"/>
    <text class="card-title red-text" x="119" y="595" text-anchor="middle">人工补正复核</text>
    <text class="card-sub muted" x="119" y="620" text-anchor="middle">可追溯修订</text>

    <rect class="red-card" x="31" y="672" width="176" height="74" rx="8"/>
    <text class="card-title red-text" x="119" y="705" text-anchor="middle">全链路审计追溯</text>
    <text class="card-sub muted" x="119" y="730" text-anchor="middle">事件与报告留痕</text>
  </g>

  <g transform="translate(152 800)">
    <rect class="blue-card" x="0" y="-16" width="32" height="20" rx="4"/>
    <text class="legend blue-text" x="44" y="0">蓝色：系统主动能模块</text>
    <rect class="yellow-card" x="380" y="-16" width="32" height="20" rx="4"/>
    <text class="legend yellow-text" x="424" y="0">黄色：SQL / 证据 / 数据库事实约束</text>
    <rect class="red-card" x="845" y="-16" width="32" height="20" rx="4"/>
    <text class="legend red-text" x="889" y="0">红色：仲裁 / 复核 / 风险可信机制</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 44px; font-weight: 700; fill: #1A2A3A; }
      .subtitle { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 22px; fill: #53657A; }
      .node-title { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #1A2A3A; }
      .node-sub { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 16px; fill: #4E6074; }
      .tech { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #5A4010; }
      .side-title { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 26px; font-weight: 700; fill: #6B1A1A; }
      .side-text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 17px; fill: #2A3A4A; }
      .footer { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #6B1A1A; }
      .red-title { fill: #6B1A1A; }
      .gold-title { fill: #5A4010; }

      .panel { fill: #FAFCFF; stroke: #D6E0EC; stroke-width: 1.8; }
      .node { fill: #F0F4FA; stroke: #5B7FA6; stroke-width: 2; }
      .node-gold { fill: #FFFBF0; stroke: #C8A951; stroke-width: 2.1; }
      .node-red { fill: #FDF2F2; stroke: #B03030; stroke-width: 2.1; }
      .center { fill: #FFFDF6; stroke: #C8A951; stroke-width: 2.2; }
      .side { fill: #FDF7F7; stroke: #B03030; stroke-width: 2; }
      .chip { fill: #FFFFFF; stroke: #AAB7C5; stroke-width: 1.4; }
      .chip-red { fill: #FFF8F8; stroke: #D3A0A0; stroke-width: 1.5; }
      .chip-gold { fill: #FFFBF0; stroke: #D6BD69; stroke-width: 1.5; }

      .arrow { fill: none; stroke: #5B7FA6; stroke-width: 2.2; stroke-linecap: round; marker-end: url(#arrow); }
      .arrow-red { fill: none; stroke: #B03030; stroke-width: 2.2; stroke-linecap: round; marker-end: url(#arrowRed); }
      .arrow-gold { fill: none; stroke: #C8A951; stroke-width: 2.3; stroke-linecap: round; marker-end: url(#arrowGold); }
    </style>
    <marker id="arrow" markerWidth="5.5" markerHeight="5.5" refX="4.8" refY="2.75" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L4.8,2.75 L1,4.5 Z" fill="#5B7FA6"/>
    </marker>
    <marker id="arrowRed" markerWidth="5.5" markerHeight="5.5" refX="4.8" refY="2.75" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L4.8,2.75 L1,4.5 Z" fill="#B03030"/>
    </marker>
    <marker id="arrowGold" markerWidth="5.5" markerHeight="5.5" refX="4.8" refY="2.75" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L4.8,2.75 L1,4.5 Z" fill="#C8A951"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1920" height="1080"/>

  <text class="title" x="960" y="62" text-anchor="middle">人机协同与可追溯闭环</text>
  <text class="subtitle" x="960" y="99" text-anchor="middle">证据缺失、结论冲突或风险较高时，触发人工补证与复核，并沉淀完整审查轨迹</text>

  <rect class="panel" x="70" y="135" width="1380" height="770" rx="22"/>

  <!-- Center idea -->
  <ellipse class="center" cx="760" cy="510" rx="245" ry="118"/>
  <text class="node-title gold-title" x="760" y="475" text-anchor="middle">可信评审闭环</text>
  <text class="node-sub" x="760" y="510" text-anchor="middle">机器辅助审查 + 人工兜底确认</text>
  <text class="node-sub" x="760" y="543" text-anchor="middle">全过程证据化、报告化、可追溯</text>

  <!-- Loop nodes -->
  <rect class="node" x="180" y="210" width="300" height="165" rx="18"/>
  <text class="node-title" x="330" y="255" text-anchor="middle">机器初审</text>
  <text class="node-sub" x="330" y="292" text-anchor="middle">Text-to-SQL 自动取证</text>
  <text class="node-sub" x="330" y="322" text-anchor="middle">证据卡片 + 多智能体审查</text>
  <text class="tech" x="330" y="354" text-anchor="middle">Evidence-grounded Review</text>

  <rect class="node-red" x="610" y="180" width="300" height="165" rx="18"/>
  <text class="node-title red-title" x="760" y="225" text-anchor="middle">风险识别</text>
  <text class="node-sub" x="760" y="262" text-anchor="middle">证据缺失 / 条款冲突</text>
  <text class="node-sub" x="760" y="292" text-anchor="middle">低置信度 / 审计风险</text>
  <text class="tech" x="760" y="324" text-anchor="middle">Risk Flagging / Conflict Check</text>

  <rect class="node-red" x="1040" y="210" width="300" height="165" rx="18"/>
  <text class="node-title red-title" x="1190" y="255" text-anchor="middle">人工介入</text>
  <text class="node-sub" x="1190" y="292" text-anchor="middle">人工补证 / 复核确认</text>
  <text class="node-sub" x="1190" y="322" text-anchor="middle">材料说明 / 业务兜底</text>
  <text class="tech" x="1190" y="354" text-anchor="middle">Human-in-the-loop</text>

  <rect class="node-red" x="1040" y="645" width="300" height="165" rx="18"/>
  <text class="node-title red-title" x="1190" y="690" text-anchor="middle">再裁决</text>
  <text class="node-sub" x="1190" y="727" text-anchor="middle">复用原证据 + 合并人工证据</text>
  <text class="node-sub" x="1190" y="757" text-anchor="middle">重新仲裁并输出报告</text>
  <text class="tech" x="1190" y="789" text-anchor="middle">Conservative Re-adjudication</text>

  <rect class="node-gold" x="610" y="675" width="300" height="165" rx="18"/>
  <text class="node-title gold-title" x="760" y="720" text-anchor="middle">审计留痕</text>
  <text class="node-sub" x="760" y="757" text-anchor="middle">会话 / 证据 / Agent 观点</text>
  <text class="node-sub" x="760" y="787" text-anchor="middle">裁决报告 / 复核记录</text>
  <text class="tech" x="760" y="819" text-anchor="middle">Audit Trail / Session Persistence</text>

  <rect class="node" x="180" y="645" width="300" height="165" rx="18"/>
  <text class="node-title" x="330" y="690" text-anchor="middle">结果归档</text>
  <text class="node-sub" x="330" y="727" text-anchor="middle">历史会话查询</text>
  <text class="node-sub" x="330" y="757" text-anchor="middle">复查、复核与案例回放</text>
  <text class="tech" x="330" y="789" text-anchor="middle">Traceable Review Record</text>

  <!-- Loop arrows -->
  <path class="arrow" d="M480 292 C525 255, 560 245, 610 250"/>
  <path class="arrow-red" d="M910 250 C955 245, 995 255, 1040 292"/>
  <path class="arrow-red" d="M1190 375 V645"/>
  <path class="arrow-gold" d="M1040 728 C995 760, 955 765, 910 760"/>
  <path class="arrow-gold" d="M610 760 C560 765, 525 760, 480 728"/>
  <path class="arrow" d="M330 645 V375"/>

  <!-- Right detail panel -->
  <rect class="side" x="1505" y="135" width="345" height="770" rx="22"/>
  <text class="side-title" x="1678" y="195" text-anchor="middle">触发与沉淀内容</text>

  <rect class="chip-red" x="1540" y="245" width="275" height="52" rx="12"/>
  <text class="side-text" x="1678" y="278" text-anchor="middle">证据缺失或字段异常</text>
  <rect class="chip-red" x="1540" y="320" width="275" height="52" rx="12"/>
  <text class="side-text" x="1678" y="353" text-anchor="middle">Agent 结论冲突</text>
  <rect class="chip-red" x="1540" y="395" width="275" height="52" rx="12"/>
  <text class="side-text" x="1678" y="428" text-anchor="middle">低置信度或高风险标记</text>
  <rect class="chip-red" x="1540" y="470" width="275" height="52" rx="12"/>
  <text class="side-text" x="1678" y="503" text-anchor="middle">仲裁输出待补证</text>

  <rect class="chip-gold" x="1540" y="575" width="275" height="52" rx="12"/>
  <text class="side-text" x="1678" y="608" text-anchor="middle">证据引用链</text>
  <rect class="chip-gold" x="1540" y="650" width="275" height="52" rx="12"/>
  <text class="side-text" x="1678" y="683" text-anchor="middle">辩论观点与风险标记</text>
  <rect class="chip-gold" x="1540" y="725" width="275" height="52" rx="12"/>
  <text class="side-text" x="1678" y="758" text-anchor="middle">人工复核记录</text>
  <rect class="chip-gold" x="1540" y="800" width="275" height="52" rx="12"/>
  <text class="side-text" x="1678" y="833" text-anchor="middle">最终裁决报告</text>

  <rect x="70" y="955" width="1780" height="1.5" fill="#E3E9F0"/>
  <text class="footer" x="960" y="1002" text-anchor="middle">系统不是强行自动裁决，而是在不确定场景下保留人工兜底与责任留痕。</text>
</svg>

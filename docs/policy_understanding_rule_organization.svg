<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 44px; font-weight: 700; fill: #1A2A3A; }
      .subtitle { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 22px; fill: #53657A; }
      .section-title { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 26px; font-weight: 700; fill: #1A2A3A; }
      .module-title { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #1A2A3A; }
      .module-sub { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 16px; fill: #506176; }
      .small { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 15px; fill: #52657A; }
      .gold-title { fill: #5A4010; }
      .red-title { fill: #6B1A1A; }
      .note { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 19px; font-weight: 700; fill: #5A4010; }
      .footer { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 17px; fill: #5B6B7D; }

      .panel { fill: #FAFCFF; stroke: #D6E0EC; stroke-width: 1.8; }
      .panel-strong { fill: #F7FAFE; stroke: #9EB3CB; stroke-width: 2.1; }
      .module { fill: #F0F4FA; stroke: #5B7FA6; stroke-width: 2; }
      .module-gold { fill: #FFFBF0; stroke: #C8A951; stroke-width: 2.1; }
      .module-red { fill: #FDF2F2; stroke: #B03030; stroke-width: 2; }
      .rule-card { fill: #FFFFFF; stroke: #8A9BB0; stroke-width: 1.7; }
      .mapping { fill: #FFFDF6; stroke: #D6BD69; stroke-width: 1.9; }
      .mapping-step { fill: #FFFBF0; stroke: #C8A951; stroke-width: 1.9; }

      .arrow { fill: none; stroke: #5B7FA6; stroke-width: 2.2; stroke-linecap: round; marker-end: url(#arrow); }
      .arrow-gold { fill: none; stroke: #C8A951; stroke-width: 2.2; stroke-linecap: round; marker-end: url(#arrowGold); }
    </style>
    <marker id="arrow" markerWidth="5.5" markerHeight="5.5" refX="4.8" refY="2.75" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L4.8,2.75 L1,4.5 Z" fill="#5B7FA6"/>
    </marker>
    <marker id="arrowGold" markerWidth="5.5" markerHeight="5.5" refX="4.8" refY="2.75" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L4.8,2.75 L1,4.5 Z" fill="#C8A951"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1920" height="1080"/>

  <text class="title" x="960" y="62" text-anchor="middle">政策理解与规则组织</text>
  <text class="subtitle" x="960" y="99" text-anchor="middle">将非结构化政策条款转化为可路由、可取证、可解释的机器可执行规则</text>

  <!-- Three-stage policy understanding structure -->
  <rect class="panel" x="80" y="150" width="470" height="560" rx="20"/>
  <text class="section-title" x="315" y="198" text-anchor="middle">政策原文输入</text>
  <text class="small" x="315" y="229" text-anchor="middle">来自政策文件、办事指南与业务规则说明</text>

  <rect class="module" x="130" y="290" width="370" height="245" rx="18"/>
  <text class="module-title" x="165" y="337">重点信息项：</text>
  <text class="module-title" x="175" y="390">政策文件</text>
  <text class="module-title" x="335" y="390">办理条件</text>
  <text class="module-title red-title" x="175" y="440">排除情形</text>
  <text class="module-title" x="335" y="440">适用对象</text>
  <text class="module-title gold-title" x="175" y="490">补贴标准</text>

  <text class="module-sub" x="145" y="595">系统首先从政策原文中提取</text>
  <text class="module-sub" x="145" y="626">对象、条件、排除项和补贴标准，</text>
  <text class="module-sub" x="145" y="657">为后续结构化规则与取证问题</text>
  <text class="module-sub" x="145" y="688">生成提供原始依据。</text>

  <rect class="panel-strong" x="725" y="150" width="470" height="560" rx="20"/>
  <text class="section-title" x="960" y="198" text-anchor="middle">政策理解与结构化解析</text>
  <text class="small" x="960" y="229" text-anchor="middle">把政策文本拆解为可计算、可映射、可确认的规则单元</text>

  <rect class="module" x="790" y="275" width="340" height="58" rx="12"/>
  <text class="module-title" x="960" y="300" text-anchor="middle">条款抽取</text>
  <text class="module-sub" x="960" y="323" text-anchor="middle">识别政策条件与业务对象</text>
  <rect class="module" x="790" y="365" width="340" height="58" rx="12"/>
  <text class="module-title" x="960" y="390" text-anchor="middle">条件分类</text>
  <text class="module-sub" x="960" y="413" text-anchor="middle">准入 / 排除 / 推断 / 计算</text>
  <rect class="module" x="790" y="455" width="340" height="58" rx="12"/>
  <text class="module-title" x="960" y="480" text-anchor="middle">语义归一</text>
  <text class="module-sub" x="960" y="503" text-anchor="middle">统一对象、字段、时间范围</text>
  <rect class="module" x="790" y="545" width="340" height="58" rx="12"/>
  <text class="module-title" x="960" y="570" text-anchor="middle">政策路由</text>
  <text class="module-sub" x="960" y="593" text-anchor="middle">匹配适用政策与规则集合</text>
  <rect class="module-gold" x="790" y="635" width="340" height="58" rx="12"/>
  <text class="module-title gold-title" x="960" y="660" text-anchor="middle">可验证问题生成</text>
  <text class="module-sub" x="960" y="683" text-anchor="middle">规则转化为取证任务</text>

  <rect class="panel" x="1370" y="150" width="470" height="560" rx="20"/>
  <text class="section-title" x="1605" y="198" text-anchor="middle">规则组织与取证映射</text>
  <text class="small" x="1605" y="229" text-anchor="middle">输出结构化规则，服务后续 Text-to-SQL 自动取证</text>

  <rect class="rule-card" x="1418" y="278" width="175" height="118" rx="12"/>
  <text class="module-title" x="1505" y="313" text-anchor="middle">基础条件</text>
  <text class="module-sub" x="1505" y="344" text-anchor="middle">是否满足</text>
  <text class="module-sub" x="1505" y="367" text-anchor="middle">准入门槛</text>
  <rect class="module-red" x="1618" y="278" width="175" height="118" rx="12"/>
  <text class="module-title red-title" x="1705" y="313" text-anchor="middle">排除条件</text>
  <text class="module-sub" x="1705" y="344" text-anchor="middle">是否命中</text>
  <text class="module-sub" x="1705" y="367" text-anchor="middle">禁止情形</text>

  <rect class="rule-card" x="1418" y="450" width="175" height="118" rx="12"/>
  <text class="module-title" x="1505" y="485" text-anchor="middle">推断规则</text>
  <text class="module-sub" x="1505" y="516" text-anchor="middle">多字段联合</text>
  <text class="module-sub" x="1505" y="539" text-anchor="middle">语义判断</text>
  <rect class="module-gold" x="1618" y="450" width="175" height="118" rx="12"/>
  <text class="module-title gold-title" x="1705" y="485" text-anchor="middle">计算规则</text>
  <text class="module-sub" x="1705" y="516" text-anchor="middle">补贴金额</text>
  <text class="module-sub" x="1705" y="539" text-anchor="middle">期限与标准</text>

  <rect class="module-gold" x="1458" y="620" width="295" height="62" rx="12"/>
  <text class="module-title gold-title" x="1605" y="646" text-anchor="middle">结构化政策规则</text>
  <text class="module-sub" x="1605" y="671" text-anchor="middle">PolicyRule / Rule ID / Evidence Need</text>

  <path class="arrow" d="M550 430 H725"/>
  <path class="arrow" d="M1195 430 H1370"/>

  <text class="note" x="960" y="760" text-anchor="middle">规则不直接产生资格结论，而是先转化为可验证取证问题</text>

  <!-- Bottom evidence mapping chain -->
  <rect class="mapping" x="180" y="805" width="1560" height="150" rx="18"/>
  <text class="section-title gold-title" x="960" y="846" text-anchor="middle">面向 Text-to-SQL 的取证映射链</text>

  <rect class="mapping-step" x="280" y="875" width="220" height="55" rx="11"/>
  <text class="module-title gold-title" x="390" y="910" text-anchor="middle">规则 ID</text>
  <rect class="mapping-step" x="595" y="875" width="220" height="55" rx="11"/>
  <text class="module-title gold-title" x="705" y="910" text-anchor="middle">取证问题</text>
  <rect class="mapping-step" x="910" y="875" width="260" height="55" rx="11"/>
  <text class="module-title gold-title" x="1040" y="910" text-anchor="middle">Schema / 字段映射</text>
  <rect class="mapping-step" x="1265" y="875" width="260" height="55" rx="11"/>
  <text class="module-title gold-title" x="1395" y="910" text-anchor="middle">SQL 查询任务</text>

  <path class="arrow-gold" d="M500 903 H595"/>
  <path class="arrow-gold" d="M815 903 H910"/>
  <path class="arrow-gold" d="M1170 903 H1265"/>

  <rect x="80" y="998" width="1760" height="1.5" fill="#E3E9F0"/>
  <text class="footer" x="960" y="1032" text-anchor="middle">该页强调：政策理解阶段的目标不是替代审核结论，而是生成可被数据库事实验证的规则与取证任务。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 42px; font-weight: 700; fill: #1A2A3A; }
      .subtitle { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 23px; font-weight: 500; fill: #52657A; }
      .layer-title { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #1A2A3A; }
      .group-title { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #2A3A4A; }
      .module-title { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #1A2A3A; }
      .module-sub { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 13px; fill: #4E6074; }
      .core-title { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #1A2A3A; }
      .core-sub { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 11.5px; fill: #4E6074; }
      .gold-title { fill: #5A4010; }
      .red-title { fill: #6B1A1A; }
      .note { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #5A4010; }
      .label { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #8A6B18; }
      .side-title { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #6B1A1A; }
      .side-item { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #2A3A4A; }
      .foot { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 15px; fill: #5B6B7D; }

      .layer { fill: #FAFCFF; stroke: #D6E0EC; stroke-width: 1.7; }
      .layer-core { fill: #F7FAFE; stroke: #9EB3CB; stroke-width: 2.1; }
      .module { fill: #F0F4FA; stroke: #5B7FA6; stroke-width: 1.9; }
      .module-gold { fill: #FFFBF0; stroke: #C8A951; stroke-width: 2; }
      .module-red { fill: #FDF2F2; stroke: #B03030; stroke-width: 2; }
      .support { fill: #F5F7FA; stroke: #8A9BB0; stroke-width: 1.6; }
      .support-group { fill: #FBFCFE; stroke: #D6DEE8; stroke-width: 1.5; }
      .trust { fill: #FDF7F7; stroke: #B03030; stroke-width: 1.7; }
      .trust-node { fill: #FFFFFF; stroke: #D3A0A0; stroke-width: 1.4; }
      .legend-text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #2A3A4A; }

      .arrow { fill: none; stroke: #5B7FA6; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .arrow-gold { fill: none; stroke: #C8A951; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowGold); }
      .arrow-red { fill: none; stroke: #B03030; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowRed); }
    </style>
    <marker id="arrow" markerWidth="5.5" markerHeight="5.5" refX="4.8" refY="2.75" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L4.8,2.75 L1,4.5 Z" fill="#5B7FA6"/>
    </marker>
    <marker id="arrowGold" markerWidth="5.5" markerHeight="5.5" refX="4.8" refY="2.75" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L4.8,2.75 L1,4.5 Z" fill="#C8A951"/>
    </marker>
    <marker id="arrowRed" markerWidth="5.5" markerHeight="5.5" refX="4.8" refY="2.75" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L4.8,2.75 L1,4.5 Z" fill="#B03030"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1920" height="1080"/>

  <text class="title" x="960" y="58" text-anchor="middle">智策通系统总体架构</text>
  <text class="subtitle" x="960" y="94" text-anchor="middle">面向政策资格认定的多智能体辩论式 Text-to-SQL 智能评审系统</text>

  <!-- Main five-layer structure -->
  <g id="main-layers">
    <!-- Interaction layer -->
    <rect class="layer" x="70" y="125" width="1450" height="105" rx="17"/>
    <text class="layer-title" x="118" y="187">交互展示层</text>

    <rect class="module" x="360" y="151" width="210" height="52" rx="10"/>
    <text class="module-title" x="465" y="174" text-anchor="middle">Vue 前端界面</text>
    <text class="module-sub" x="465" y="195" text-anchor="middle">Element Plus / Vite</text>
    <rect class="module" x="610" y="151" width="220" height="52" rx="10"/>
    <text class="module-title" x="720" y="174" text-anchor="middle">审查过程可视化</text>
    <text class="module-sub" x="720" y="195" text-anchor="middle">SSE 流式事件展示</text>
    <rect class="module" x="870" y="151" width="225" height="52" rx="10"/>
    <text class="module-title" x="982" y="174" text-anchor="middle">证据与观点面板</text>
    <text class="module-sub" x="982" y="195" text-anchor="middle">证据卡片 / Agent 观点</text>
    <rect class="module-red" x="1135" y="151" width="225" height="52" rx="10"/>
    <text class="module-title red-title" x="1248" y="174" text-anchor="middle">复核与报告入口</text>
    <text class="module-sub" x="1248" y="195" text-anchor="middle">人工补证 / 裁决报告</text>

    <!-- Service layer -->
    <rect class="layer" x="70" y="275" width="1450" height="105" rx="17"/>
    <text class="layer-title" x="118" y="337">服务接口层</text>

    <rect class="module" x="360" y="301" width="210" height="52" rx="10"/>
    <text class="module-title" x="465" y="324" text-anchor="middle">FastAPI 服务</text>
    <text class="module-sub" x="465" y="345" text-anchor="middle">api/main.py</text>
    <rect class="module" x="610" y="301" width="220" height="52" rx="10"/>
    <text class="module-title" x="720" y="324" text-anchor="middle">审查任务接口</text>
    <text class="module-sub" x="720" y="345" text-anchor="middle">intent / debate / stream</text>
    <rect class="module" x="870" y="301" width="225" height="52" rx="10"/>
    <text class="module-title" x="982" y="324" text-anchor="middle">历史会话接口</text>
    <text class="module-sub" x="982" y="345" text-anchor="middle">sessions / detail / review</text>
    <rect class="module" x="1135" y="301" width="225" height="52" rx="10"/>
    <text class="module-title" x="1248" y="324" text-anchor="middle">官方报告接口</text>
    <text class="module-sub" x="1248" y="345" text-anchor="middle">PDF 生成与下载</text>

    <!-- Core orchestration layer -->
    <rect class="layer-core" x="70" y="425" width="1450" height="160" rx="18"/>
    <text class="layer-title" x="118" y="516">智能评审编排层</text>

    <text class="note" x="1470" y="568" text-anchor="end">先取证，后推理：SQL事实优先</text>

    <rect class="module" x="360" y="476" width="185" height="56" rx="10"/>
    <text class="core-title" x="452" y="499" text-anchor="middle">意图政策理解</text>
    <text class="core-sub" x="452" y="521" text-anchor="middle">intent / policy router</text>

    <rect class="module-gold" x="590" y="476" width="185" height="56" rx="10"/>
    <text class="core-title gold-title" x="682" y="499" text-anchor="middle">Text-to-SQL</text>
    <text class="core-sub" x="682" y="521" text-anchor="middle">生成 / 执行 / 修复</text>

    <rect class="module-gold" x="820" y="476" width="185" height="56" rx="10"/>
    <text class="core-title gold-title" x="912" y="499" text-anchor="middle">证据标准化</text>
    <text class="core-sub" x="912" y="521" text-anchor="middle">EvidenceItem / Bundle</text>

    <rect class="module" x="1050" y="476" width="185" height="56" rx="10"/>
    <text class="core-title" x="1142" y="499" text-anchor="middle">辩论编排</text>
    <text class="core-sub" x="1142" y="521" text-anchor="middle">多轮审查</text>

    <rect class="module-red" x="1280" y="476" width="185" height="56" rx="10"/>
    <text class="core-title red-title" x="1372" y="499" text-anchor="middle">仲裁与报告生成</text>
    <text class="core-sub" x="1372" y="521" text-anchor="middle">Arbiter / Report / PDF</text>

    <path class="arrow" d="M545 504 H590"/>
    <path class="arrow-gold" d="M775 504 H820"/>
    <text class="label" x="797" y="486" text-anchor="middle">SQL事实约束</text>
    <path class="arrow-gold" d="M1005 504 H1050"/>
    <path class="arrow-red" d="M1235 504 H1280"/>

    <!-- Agent layer -->
    <rect class="layer" x="70" y="630" width="1450" height="105" rx="17"/>
    <text class="layer-title" x="118" y="692">多智能体协同层</text>

    <rect class="module-red" x="360" y="657" width="150" height="52" rx="10"/>
    <text class="module-title red-title" x="435" y="689" text-anchor="middle">严格合规 Agent</text>
    <rect class="module" x="535" y="657" width="150" height="52" rx="10"/>
    <text class="module-title" x="610" y="689" text-anchor="middle">宽松业务 Agent</text>
    <rect class="module" x="710" y="657" width="150" height="52" rx="10"/>
    <text class="module-title" x="785" y="689" text-anchor="middle">探索补充 Agent</text>
    <rect class="module" x="885" y="657" width="150" height="52" rx="10"/>
    <text class="module-title" x="960" y="689" text-anchor="middle">经验案例 Agent</text>
    <rect class="module-red" x="1060" y="657" width="150" height="52" rx="10"/>
    <text class="module-title red-title" x="1135" y="689" text-anchor="middle">审计质询 Agent</text>
    <rect class="module-red" x="1235" y="657" width="150" height="52" rx="10"/>
    <text class="module-title red-title" x="1310" y="689" text-anchor="middle">仲裁智能体</text>

    <!-- Support layer -->
    <rect class="layer" x="70" y="780" width="1450" height="160" rx="17"/>
    <text class="layer-title" x="118" y="869">知识与数据支撑层</text>

    <rect class="support-group" x="360" y="808" width="590" height="104" rx="13"/>
    <text class="group-title" x="390" y="840">A. 知识支撑</text>
    <rect class="support" x="390" y="852" width="165" height="48" rx="9"/>
    <text class="module-title" x="472" y="873" text-anchor="middle">政策知识库</text>
    <text class="module-sub" x="472" y="892" text-anchor="middle">JSON / 政策文本</text>
    <rect class="support" x="575" y="852" width="170" height="48" rx="9"/>
    <text class="module-title" x="660" y="873" text-anchor="middle">数据库 Schema</text>
    <text class="module-sub" x="660" y="892" text-anchor="middle">schema_struct.sql</text>
    <rect class="support" x="765" y="852" width="155" height="48" rx="9"/>
    <text class="module-title" x="842" y="873" text-anchor="middle">业务字典</text>
    <text class="module-sub" x="842" y="892" text-anchor="middle">dicts / 枚举映射</text>

    <rect class="support-group" x="990" y="808" width="410" height="104" rx="13"/>
    <text class="group-title" x="1020" y="840">B. 数据支撑</text>
    <rect class="module-gold" x="1020" y="852" width="165" height="48" rx="9"/>
    <text class="module-title gold-title" x="1102" y="873" text-anchor="middle">业务数据库</text>
    <text class="module-sub" x="1102" y="892" text-anchor="middle">社保 / 就业 / 企业</text>
    <rect class="support" x="1205" y="852" width="165" height="48" rx="9"/>
    <text class="module-title" x="1288" y="873" text-anchor="middle">审查记录存储</text>
    <text class="module-sub" x="1288" y="892" text-anchor="middle">会话 / 证据 / 报告</text>
  </g>

  <!-- Only inter-layer arrows, no cross-layer wiring -->
  <path class="arrow" d="M795 230 V275"/>
  <path class="arrow" d="M795 380 V425"/>
  <path class="arrow" d="M795 585 V630"/>
  <path class="arrow" d="M795 735 V780"/>

  <!-- Right trust bar -->
  <rect class="trust" x="1548" y="125" width="215" height="815" rx="17"/>
  <text class="side-title" x="1656" y="165" text-anchor="middle">贯穿式可信</text>
  <text class="side-title" x="1656" y="193" text-anchor="middle">评审机制</text>

  <rect class="trust-node" x="1568" y="220" width="176" height="78" rx="11"/>
  <text class="side-item" x="1656" y="252" text-anchor="middle">证据约束</text>
  <text class="side-item" x="1656" y="278" text-anchor="middle">推理</text>
  <rect class="trust-node" x="1568" y="342" width="176" height="78" rx="11"/>
  <text class="side-item" x="1656" y="374" text-anchor="middle">SQL执行反馈</text>
  <text class="side-item" x="1656" y="400" text-anchor="middle">自动修复</text>
  <rect class="trust-node" x="1568" y="464" width="176" height="78" rx="11"/>
  <text class="side-item" x="1656" y="496" text-anchor="middle">多角色冲突</text>
  <text class="side-item" x="1656" y="522" text-anchor="middle">检测</text>
  <rect class="trust-node" x="1568" y="586" width="176" height="78" rx="11"/>
  <text class="side-item" x="1656" y="618" text-anchor="middle">保守仲裁</text>
  <text class="side-item" x="1656" y="644" text-anchor="middle">裁决</text>
  <rect class="trust-node" x="1568" y="708" width="176" height="78" rx="11"/>
  <text class="side-item" x="1656" y="740" text-anchor="middle">人工补证</text>
  <text class="side-item" x="1656" y="766" text-anchor="middle">复核</text>
  <rect class="trust-node" x="1568" y="830" width="176" height="78" rx="11"/>
  <text class="side-item" x="1656" y="862" text-anchor="middle">全链路审计</text>
  <text class="side-item" x="1656" y="888" text-anchor="middle">追溯</text>

  <rect x="70" y="966" width="1780" height="1.5" fill="#E3E9F0"/>
  <g id="legend">
    <rect class="module" x="460" y="982" width="26" height="14" rx="3"/>
    <text class="legend-text" x="500" y="995">蓝色：系统主功能模块</text>
    <rect class="module-gold" x="710" y="982" width="26" height="14" rx="3"/>
    <text class="legend-text" x="750" y="995">黄色：SQL / 证据 / 数据库事实约束</text>
    <rect class="module-red" x="1088" y="982" width="26" height="14" rx="3"/>
    <text class="legend-text" x="1128" y="995">红色：仲裁 / 复核 / 风险可信机制</text>
  </g>
  <text class="foot" x="960" y="1038" text-anchor="middle">核心特征：政策规则与数据库事实共同约束模型推理，多智能体暴露争议，保守仲裁、人工复核与审计追溯形成政务可信闭环。</text>
</svg>

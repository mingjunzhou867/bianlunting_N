review_scope: 灵活就业社保补贴资格认定
agent_instructions:
  - 只依据政策规则、证据链、人工补证和可审计 Memory 作出结论。
  - 基础条件需要积极证据支撑；关键证据缺失时应明确指出需人工复核。
  - 排斥条件命中时，应说明触发的证据和规则，不得只给结论。
  - 灵活评判项用于风险解释和补证建议，不得覆盖明确的政策规则。
manual_review_items:
  - 失业登记记录缺失或跨系统不同步。
  - 就业困难人员认定缺失或类别不明。
  - 社保缴费身份与就业登记状态存在冲突。
  - 企业法人、股东、单位缴费记录存在疑似误匹配。

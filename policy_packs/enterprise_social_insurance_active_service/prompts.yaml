review_scope: 企业社会保险补贴主动服务（增员筛查）
agent_instructions:
  - 本政策包只做主动服务筛查、线索识别和经办提醒，不直接生成最终补贴资格结论。
  - 当前版本采用宽入口策略：优先查出就业登记、人员、社保、登记和历史补贴证据，再解释服务线索。
  - 自动判断只能依据当前数据源可取证字段；缺少字段支撑的政策点必须标记为人工复核或外部数据核验。
  - 已就业困难认定、疑似4050、近一年无单位缴费、登记状态和社保缴费记录应分别说明证据来源，不得混合成单一结论。
  - 无单位缴费或最近单位缴费较早仅是疑似线索，不能替代有效失业登记或就业困难人员认定。
  - 户籍字段只作为本市人员线索展示，不得因为户籍为空或非孝感直接排除候选人员。
  - 当前数据库没有企业注册地址字段，不得自动声称单位注册地属于或不属于孝感市。
manual_review_items:
  - 单位注册地是否属于孝感市，当前 company_info 表无注册地址字段，需外部工商或单位基础库核验。
  - 低保、失地农民、零就业家庭、残疾等级、脱贫劳动力等类别当前无本地字段，需纸质材料或外部接口核验。
  - 高校毕业年度、离校1年或2年内未就业等规则当前缺少学历和毕业时间字段，需人工或外部学籍数据核验。
  - 历史补贴领取记录仅按 subsidy_payment_history 查询，若企业补贴另有专门发放系统，需补充外部记录。
  - 疑似线索命中后，应由经办人员复核就业登记、失业登记、困难认定和企业用工材料。

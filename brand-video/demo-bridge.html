<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>智策通 - 流程演示承接页</title>
    <style>
      :root {
        --blue-900: #123c69;
        --blue-700: #1d5c9f;
        --blue-500: #2d7dc9;
        --gold-500: #c99a3f;
        --ink: #17324d;
        --muted: #5f7489;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #dbe9f6;
        font-family:
          "Microsoft YaHei",
          "PingFang SC",
          "Noto Sans CJK SC",
          Arial,
          sans-serif;
      }

      .stage {
        position: relative;
        width: 100vw;
        height: 100vh;
        min-height: 600px;
        overflow: hidden;
        color: var(--ink);
        background:
          radial-gradient(circle at 48% 45%, rgba(255, 255, 255, 0.98) 0 16%, rgba(238, 247, 255, 0.86) 34%, rgba(206, 225, 242, 0.76) 60%, rgba(160, 195, 224, 0.72) 100%),
          linear-gradient(135deg, #eef6fd 0%, #d9e9f6 46%, #b9d2e8 100%);
      }

      .stage::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(29, 92, 159, 0.09) 1px, transparent 1px),
          linear-gradient(90deg, rgba(29, 92, 159, 0.09) 1px, transparent 1px);
        background-size: 72px 72px;
        mask-image: radial-gradient(circle at center, #000 0%, rgba(0, 0, 0, 0.9) 40%, transparent 82%);
      }

      .stage::after {
        content: "";
        position: absolute;
        inset: -18%;
        background:
          linear-gradient(120deg, transparent 18%, rgba(255, 255, 255, 0.6) 27%, transparent 37%),
          linear-gradient(120deg, transparent 50%, rgba(45, 125, 201, 0.14) 56%, transparent 66%);
        opacity: 0.72;
        transform: translateX(8%);
      }

      .corner {
        position: absolute;
        z-index: 1;
        width: min(34vw, 520px);
        height: min(28vw, 360px);
        opacity: 0.82;
      }

      .corner-left {
        left: 0;
        bottom: 0;
        background:
          linear-gradient(36deg, rgba(18, 60, 105, 0.18), transparent 58%),
          linear-gradient(90deg, rgba(201, 154, 63, 0.18), transparent 44%);
        clip-path: polygon(0 0, 100% 100%, 0 100%);
      }

      .corner-right {
        top: 0;
        right: 0;
        background:
          linear-gradient(220deg, rgba(45, 125, 201, 0.18), transparent 58%),
          linear-gradient(180deg, rgba(201, 154, 63, 0.16), transparent 50%);
        clip-path: polygon(0 0, 100% 0, 100% 100%);
      }

      .layout {
        position: relative;
        z-index: 3;
        width: 100%;
        height: 100%;
        padding: clamp(34px, 4.2vw, 76px);
        display: grid;
        grid-template-columns: 70fr 30fr;
        gap: clamp(22px, 3vw, 48px);
      }

      .video-side {
        min-width: 0;
        display: grid;
        grid-template-rows: auto 1fr;
        gap: clamp(16px, 2vw, 28px);
      }

      .progress-label {
        width: fit-content;
        min-width: 360px;
        min-height: 58px;
        padding: 12px 18px;
        display: flex;
        align-items: center;
        gap: 14px;
        color: var(--blue-900);
        font-size: clamp(18px, 1.5vw, 26px);
        font-weight: 850;
        background: rgba(255, 255, 255, 0.64);
        border: 1px solid rgba(29, 92, 159, 0.16);
        box-shadow: 0 14px 28px rgba(18, 60, 105, 0.08);
        backdrop-filter: blur(12px);
      }

      .progress-label::before {
        content: "";
        width: 6px;
        height: 30px;
        background: linear-gradient(180deg, var(--blue-500), var(--gold-500));
      }

      .video-shell {
        align-self: center;
        width: min(104%, 1320px);
        max-width: none;
        aspect-ratio: 16 / 9;
        position: relative;
        transform: scale(1.1);
        transform-origin: left bottom;
        overflow: hidden;
        border: 1px solid rgba(29, 92, 159, 0.22);
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.72), rgba(238, 247, 255, 0.42)),
          rgba(255, 255, 255, 0.5);
        box-shadow: 0 30px 64px rgba(18, 60, 105, 0.18);
        backdrop-filter: blur(14px);
      }

      .concept-strip {
        position: absolute;
        z-index: 6;
        left: clamp(34px, 4.2vw, 76px);
        bottom: clamp(12px, 1.6vw, 30px);
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        max-width: 64vw;
      }

      .concept-strip span {
        padding: 10px 16px;
        color: var(--blue-900);
        font-size: clamp(13px, 1vw, 17px);
        font-weight: 850;
        background: rgba(255, 255, 255, 0.68);
        border: 1px solid rgba(29, 92, 159, 0.16);
        box-shadow: 0 12px 24px rgba(18, 60, 105, 0.08);
        backdrop-filter: blur(10px);
      }

      .video-shell::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(rgba(29, 92, 159, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(29, 92, 159, 0.08) 1px, transparent 1px);
        background-size: 48px 48px;
        opacity: 0.55;
      }

      .video-placeholder {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: rgba(18, 60, 105, 0.46);
        font-size: clamp(26px, 2.6vw, 46px);
        font-weight: 850;
        letter-spacing: 0;
      }

      .video-placeholder span {
        padding: 16px 26px;
        background: rgba(255, 255, 255, 0.56);
        border: 1px solid rgba(29, 92, 159, 0.14);
      }

      .demo-video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .detail-side {
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding-right: clamp(8px, 1vw, 18px);
      }

      .detail-panel {
        min-height: min(500px, 62vh);
      }

      .detail-kicker {
        margin: 0 0 18px;
        color: var(--gold-500);
        font-size: clamp(15px, 1.2vw, 20px);
        font-weight: 850;
      }

      .detail-title {
        margin: 0;
        color: var(--blue-900);
        font-size: clamp(34px, 3.9vw, 68px);
        line-height: 1.12;
        font-weight: 850;
        letter-spacing: 0;
      }

      .detail-copy {
        margin: 24px 0 0;
        color: var(--muted);
        font-size: clamp(18px, 1.55vw, 28px);
        line-height: 1.55;
        font-weight: 700;
      }

      .detail-tags {
        margin-top: 34px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .detail-tags span {
        padding: 10px 14px;
        color: var(--blue-900);
        font-size: clamp(14px, 1.05vw, 18px);
        font-weight: 850;
        background: rgba(255, 255, 255, 0.68);
        border: 1px solid rgba(29, 92, 159, 0.16);
        box-shadow: 0 12px 24px rgba(18, 60, 105, 0.08);
      }

      .footer-badge {
        position: absolute;
        z-index: 12;
        right: clamp(28px, 2.8vw, 54px);
        bottom: clamp(12px, 1.6vw, 30px);
        display: flex;
        align-items: center;
        gap: clamp(12px, 1.2vw, 18px);
        padding: 0;
      }

      .project-mark,
      .competition-mark {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .project-mark img {
        width: clamp(34px, 3vw, 48px);
        height: auto;
        display: block;
        filter: drop-shadow(0 8px 14px rgba(18, 60, 105, 0.16));
      }

      .project-name {
        color: var(--blue-900);
        font-size: clamp(13px, 1vw, 17px);
        font-weight: 900;
        line-height: 1;
        letter-spacing: 0;
        white-space: nowrap;
        text-shadow: 0 1px 4px rgba(255, 255, 255, 0.86);
      }

      .competition-mark img {
        width: clamp(30px, 2.7vw, 42px);
        height: auto;
        display: block;
        filter: drop-shadow(0 8px 14px rgba(18, 60, 105, 0.18));
      }

      .competition-text {
        max-width: 210px;
        color: var(--blue-900);
        font-size: clamp(11px, 0.86vw, 14px);
        font-weight: 850;
        line-height: 1.28;
        letter-spacing: 0;
        white-space: nowrap;
        text-shadow: 0 1px 4px rgba(255, 255, 255, 0.82);
      }

      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
          grid-template-rows: auto auto;
          overflow-y: auto;
        }

        .progress-label {
          min-width: 0;
          width: 100%;
        }

        .detail-side {
          justify-content: flex-start;
          padding-right: 0;
        }

        .concept-strip {
          position: relative;
          left: auto;
          bottom: auto;
          max-width: none;
          padding: 0 28px 24px;
        }

        .footer-badge {
          right: 10px;
          bottom: 10px;
          gap: 10px;
        }

        .competition-text {
          max-width: 160px;
          white-space: normal;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage" aria-label="智策通项目流程演示承接页">
      <div class="corner corner-left"></div>
      <div class="corner corner-right"></div>

      <section class="layout">
        <div class="video-side">
          <div class="progress-label" aria-label="进度文字预留区"></div>

          <div class="video-shell">
            <!-- Put your recorded demo video at ./assets/demo-flow.mp4, then uncomment the next line. -->
            <!-- <video class="demo-video" src="./assets/demo-flow.mp4" controls></video> -->
            <div class="video-placeholder"><span>项目流程视频区域</span></div>
          </div>
        </div>

        <aside class="detail-side" aria-label="流程细节描述">
          <div class="detail-panel" aria-label="右侧流程说明预留区"></div>
        </aside>
      </section>

      <div class="concept-strip" aria-label="核心概念">
        <span>政策理解</span>
        <span>证据链取证</span>
        <span>多Agent辩论</span>
        <span>裁决复核</span>
      </div>

      <div class="footer-badge" aria-label="智策通与第十六届中国大学生计算机设计大赛">
        <div class="project-mark" aria-label="智策通">
          <img src="./assets/logo-round-cutout.png" alt="智策通 Logo" />
          <div class="project-name">智策通</div>
        </div>
        <div class="competition-mark" aria-label="第十六届中国大学生计算机设计大赛">
          <img src="./assets/competition-logo.png" alt="中国大学生计算机设计大赛 Logo" />
          <div class="competition-text">第十六届中国大学生计算机设计大赛</div>
        </div>
      </div>
    </main>
  </body>
</html>
